<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-KPI · Events 模块独立预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "react":           "https://esm.sh/react@18.3.1",
        "react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
        "lucide-react":    "https://esm.sh/lucide-react@0.408.0?deps=react@18.3.1"
      }
    }
  </script>
  <style>
    body { background: #0a0a0d; color: white; font-family: -apple-system,BlinkMacSystemFont,sans-serif; margin: 0; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0d; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState } from "react";
    import { createRoot } from "react-dom/client";
    import EventsPage from "./pages/EventsPage.js";
    import { TEAM } from "./data/team.js";
    
    const e = React.createElement;
    
    function App() {
      const [currentUserId, setCurrentUserId] = useState("j");
      const currentUser = TEAM.find(u => u.id === currentUserId) || TEAM[0];
      return e("div", { className: "min-h-screen bg-[#0a0a0d]" },
        e("div", { className: "border-b border-white/[0.06] px-5 py-3 flex items-center justify-between" },
          e("div", { className: "flex items-center gap-3" },
            e("div", { className: "text-[12px] text-white font-bold tracking-wider" }, "VILTROX"),
            e("span", { className: "text-[10px] text-slate-500" }, "/"),
            e("span", { className: "text-[11.5px] text-slate-300" }, "V-KPI · Events"),
            e("span", { className: "text-[9.5px] px-1.5 py-0.5 rounded bg-purple-500/15 text-purple-300 font-medium" }, "PREVIEW")
          ),
          e("div", { className: "flex items-center gap-2" },
            e("span", { className: "text-[10px] text-slate-500" }, "登录身份 (demo):"),
            e("div", { className: "flex items-center gap-0.5 rounded-md border border-white/[0.06] p-0.5" },
              TEAM.map(u => {
                const active = currentUserId === u.id;
                return e("button", { key: u.id, onClick: () => setCurrentUserId(u.id),
                  className: `px-2 py-1 rounded flex items-center gap-1.5 text-[10.5px] font-medium ${active ? "" : "text-slate-500 hover:text-slate-300"}`,
                  style: active ? { background: u.color + "25", color: u.color } : {}
                },
                  e("div", { className: "w-4 h-4 rounded-full flex items-center justify-center text-[8.5px] font-bold text-white", style: { background: u.color } }, u.initial),
                  u.name
                );
              })
            )
          )
        ),
        e(EventsPage, { currentUser })
      );
    }
    
    createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
