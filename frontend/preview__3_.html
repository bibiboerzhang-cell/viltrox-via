<script>
const STAGES=["发现","已联系","已回复","已合作","已发货","已到货","已发布","已统计","已关闭"];
const STATUSES=["全部","规划中","进行中","收尾中","已结束","已取消"];
const NAVS=[['work','⌘','我的工作台'],['platform','▦','我的平台'],['search','◎','搜索红人'],['projects','▣','我的项目'],['shortlink','↗','我的短链'],['attribution','⌯','我的归因'],['product','✦','产品作战'],['analytics','↯','数据分析'],['settings','⚙︎','个人设置']];
const TABS=[['kol','参与 KOL'],['summary','数据汇总'],['materials','物料'],['fees','费用'],['contracts','合同归档'],['review','复盘']];
const PIPE_TEXT={1:'发现到联系转化低',2:'联系到回复转化低',3:'回复到合作转化低',4:'合作到发货转化低',5:'发货到到货转化低',6:'到货到发布转化低',7:'发布到统计转化低',8:'统计到关闭转化低'};
let uid=3000;
const e=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const slug=s=>'kol_'+String(s).replace('@','').toLowerCase().replace(/[^a-z0-9]+/g,'_');
const initials=s=>String(s).replace('@','').split(/[_\.\- ]+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase()||'K';
const nfmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
function makeKol(handle,platform,followers,stage,group='关注',level='腰部',opts={}){
  const k={id:opts.id||slug(handle),handle,platform,followers,stage,group,level,region:opts.region||'美国',join:opts.join||'04-18',daysInStage:opts.daysInStage??Math.max(1,stage),posts:opts.posts||`${stage>=7?1:0} / 1`,exposure:opts.exposure||'—',sales:opts.sales||'—',metrics:opts.metrics||{},timeline:opts.timeline||{},tracking:opts.tracking||null,video:opts.video||null,shopifyUrl:opts.shopifyUrl||'',reminder:opts.reminder||''};
  k.initials=opts.initials||initials(handle);return ensureKol(k);
}
function ensureKol(k){
  for(let to=2;to<=9;to++){
    const done=k.stage>=to;
    k.timeline[to]=Object.assign({date:done?`05-${String(10+to).padStart(2,'0')} 10:2${to}`:'—',dur:done?`${Math.max(1,to-1)} 天`:'—',desc:done?defaultDesc(to,k):'等待推进',screenshots:0},k.timeline[to]||{});
  }
  if(!k.tracking) k.tracking={courier:'SF Express',no:k.stage>=5?'SF1234567890':'',status:k.stage>=6?'✓ 已送达':'待发货',last:'今天 09:15',delivered:k.stage>=6}; else k.tracking=Object.assign({courier:'SF Express',no:'',status:'待发货',last:'—',delivered:false},k.tracking);
  if(!k.video) k.video={title:'Real World Review: Viltrox 35mm F1.2 LAB',url:'instagram.com/p/Cxxxxxxxxx',duration:'3:42',views:k.stage>=7?k.exposure:'—',gain:'↑ 24h +180K'};
  return k;
}

function renderKolRow(k){const open=State.expandedRows.has(k.id);return `<tr class="kol-row" data-kol-row="${k.id}"><td><span class="tri ${open?'open':''}">▶</span></td><td><div class="kol"><div class="avatar">${e(k.initials)}</div><div><b>${e(k.handle)}</b><br><span class="muted">${e(k.followers)} · ${e(k.level)}</span></div></div></td><td>${platformIcon(k.platform)} ${e(k.platform)}</td><td>${e(k.join)}</td><td><span class="pill blue">${k.stage}. ${STAGES[k.stage-1]}</span></td><td>${e(k.daysInStage)} 天</td><td>${k.stage>=7?e(k.posts):'0 / 1'}</td><td><b>${e(k.exposure)}</b></td><td><b>${e(k.sales)}</b></td><td><span class="ev-chip">📷 ${shotTotal(k)} 张截图</span>${k.shopifyUrl?'<span class="ev-chip">🛒 Shopify</span>':''}${k.reminder?'<span class="ev-chip warn">⚠ 到货</span>':''}</td><td><button class="btn small ${k.stage<9?'primary':''}" data-action="advance-kol" data-kol="${k.id}" ${k.stage>=9?'disabled':''}>${k.stage<9?'推进':'完成'}</button></td></tr>${open?`<tr><td colspan="11" style="padding:0"><div class="expand">${renderKolExpand(k)}</div></td></tr>`:''}`;}
function renderKolControls(k){const tr=k.tracking||{};return `<div class="kol-ops" data-kol="${k.id}"><div class="field wide"><label>Shopify 归因链接</label><input data-kol-input="${k.id}" data-field="shopifyUrl" value="${e(k.shopifyUrl||'')}" placeholder="https://your-store.myshopify.com/... 或带 ref 的商品链接"></div><div class="inline-actions">${k.shopifyUrl?`<a class="link-chip" href="${e(k.shopifyUrl)}" target="_blank" rel="noopener">↗ 打开 Shopify</a>`:''}<button class="btn small" data-action="save-kol-settings" data-kol="${k.id}">保存链接</button></div><div class="track-hint">快递单号在「已发货」物流卡片里输入，查到已送达会自动提醒。</div>${k.reminder?`<div class="delivery-reminder">⚠ ${e(k.reminder)}</div>`:''}</div>`;}
function renderKolExpand(k){const m=k.metrics||{};return `${renderKolControls(k)}<div class="data-strip">${[['视频时长',m.len],['完播率',m.rate],['点赞',m.likes],['评论',m.comments],['分享',m.shares],['短链点击',m.clicks]].map(x=>`<div class="mini"><span>${x[0]}</span><b>${e(x[1]||'—')}</b><span>${x[1]?'自动刷新':'暂无数据'}</span></div>`).join('')}</div><div class="timeline">${[2,3,4,5,6,7,8,9].map(to=>renderTimelineStep(k,to)).join('')}</div>`;}
function renderTimelineStep(k,to){const t=k.timeline[to]||{},done=k.stage>=to;return `<div class="tl ${done?'':'todo'}"><div><strong>${e(t.date||'—')}</strong><small>停留 ${e(t.dur||'—')}</small></div><div><strong>${to-1} → ${to} ${STAGES[to-1]}</strong><small>${e(t.desc||'—')}</small><div>${t.screenshots?`<span class="shot-chip">📷 截图 ${t.screenshots}</span>`:''}</div>${to===5?renderTracking(k):''}${to===7?renderVideo(k):''}</div><div><button class="btn small" data-action="open-upload" data-kol="${k.id}" data-step="${to}">+ 截图</button></div></div>`;}
function renderTracking(k){const loading=State.trackingLoading===k.id;const tr=k.tracking||{};return `<div class="tracking ${tr.delivered?'delivered':''}"><span class="pill ${tr.delivered?'green':'red'}">${tr.delivered?'已送达':e(tr.courier||'快递')}</span><div class="track-main"><div class="track-form"><label>快递商<input data-kol-input="${k.id}" data-track-field="courier" value="${e(tr.courier||'')}" placeholder="SF / DHL / UPS"></label><label>快递单号<input class="mono" data-kol-input="${k.id}" data-track-field="no" value="${e(tr.no||'')}" placeholder="输入 tracking no."></label></div><div class="status-line">${e(tr.status||'—')}</div>${tr.delivered?`<div class="delivery-reminder green">✓ 物流已送达，系统已加入今日提醒：请跟进 KOL 发布排期。</div>`:''}</div><div style="text-align:right"><span class="pulse">每日刷新</span><div class="muted" style="margin:4px 0">上次：${e(tr.last||'—')}</div><button class="btn small" data-action="check-track" data-kol="${k.id}" ${loading?'disabled':''}>${loading?'查询中…':'查物流'}</button><button class="btn small" data-action="refresh-track" data-kol="${k.id}" ${loading?'disabled':''} style="margin-left:6px">刷新</button></div></div>`;}
function renderVideo(k){const v=k.video||{};return `<div class="video"><div class="thumb">▶</div><div><b>${e(v.title||'—')}</b><div class="muted">${e(k.handle)} · ${e(k.platform)} · ${e(v.duration||'—')}</div><div style="color:#075bd9;font-size:12px;margin-top:2px">${e(v.url||'—')}</div></div><div class="views"><b>${e(v.views||'—')}</b><span class="muted">观看</span><div style="color:#18813d;font-size:11px;margin-top:4px">${e(v.gain||'↑ 24h +180K')}</div></div></div>`;}
function renderTabPlaceholder(){const tab=TABS.find(t=>t[0]===State.currentTab);return `<div class="card empty"><h2>${e(tab?.[1]||'模块')}</h2><p>建设中：这里会显示 ${e(tab?.[1]||'模块')} 的明细、筛选和归档结果。</p></div>`;}
function platformIcon(p){return p==='YouTube'?'🎬':p==='TikTok'?'♪':'📷';}
function shotTotal(k){return Object.values(k.timeline||{}).reduce((a,t)=>a+(+t.screenshots||0),0);}
function openCampaignForm(mode){State.formMode=mode;State.modal='campaign';render();}
function renderModal(){modalRoot.innerHTML='';if(!State.modal)return;let html='';if(State.modal==='campaign')html=campaignModal();if(State.modal==='kol')html=kolModal();if(State.modal==='upload')html=uploadModal();if(State.modal==='confirm')html=confirmModal();modalRoot.innerHTML=`<div class="modal-bg active"><div class="modal">${html}</div></div>`;if(State.modal==='kol'){const pp=document.getElementById('poolPlatform'),pg=document.getElementById('poolGroup');if(pp)pp.value=State.kolPicker.platform;if(pg)pg.value=State.kolPicker.group;}}
function campaignModal(){const c=State.formMode==='edit'?currentCampaign():{name:'',product:'',price:'',status:'规划中',target:10,budget:0,spent:0,owner:'Jianbo',type:'上市推广',start:'2025-06-01',end:'2025-08-01'};return `<div class="modal-head"><div><h3>${State.formMode==='edit'?'编辑推广':'新建推广'}</h3><div class="modal-sub">提交后会立即写入前端内存 state。</div></div><button class="btn" data-action="close-modal">关闭</button></div><form id="campaignForm"><div class="form-grid"><div class="field full"><label>推广名称</label><input name="name" required value="${e(c.name)}" placeholder="例：AF 35mm F1.2 LAB FE 上市推广"></div><div class="field"><label>主推产品</label><input name="product" required value="${e(c.product)}" placeholder="35mm F1.2 LAB FE"></div><div class="field"><label>价格</label><input name="price" value="${e(c.price)}" placeholder="$999"></div><div class="field"><label>状态</label><select name="status">${STATUSES.filter(s=>s!=='全部').map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>目标 KOL 数</label><input type="number" name="target" min="0" value="${e(c.target)}"></div><div class="field"><label>预算 USD</label><input type="number" name="budget" min="0" value="${e(c.budget)}"></div><div class="field"><label>已花 USD</label><input type="number" name="spent" min="0" value="${e(c.spent)}"></div><div class="field"><label>开始时间</label><input type="date" name="start" value="${e(c.start)}"></div><div class="field"><label>计划结束</label><input type="date" name="end" value="${e(c.end)}"></div><div class="field"><label>负责人</label><input name="owner" value="${e(c.owner)}"></div><div class="field"><label>推广类型</label><input name="type" value="${e(c.type)}"></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">${State.formMode==='edit'?'保存修改':'创建推广'}</button></div></form>`;}
function kolModal(){const c=currentCampaign(),q=State.kolPicker.search.toLowerCase();const current=new Set(c.kols.map(k=>k.handle));let data=pool.filter(k=>(State.kolPicker.platform==='全部平台'||k.platform===State.kolPicker.platform)&&(State.kolPicker.group==='全部分组'||k.group===State.kolPicker.group)&&(!q||`${k.handle} ${k.platform} ${k.group} ${k.level}`.toLowerCase().includes(q)));return `<div class="modal-head"><div><h3>从我的 KOL 库添加</h3><div class="modal-sub">当前推广已有 ${c.kols.length} 个 KOL · 可批量勾选</div></div><button class="btn" data-action="close-modal">关闭</button></div><div class="kol-picker-tools"><input class="input" id="poolSearch" value="${e(State.kolPicker.search)}" placeholder="搜索 KOL handle / 名称"><select class="select" id="poolPlatform">${['全部平台','Instagram','YouTube','TikTok'].map(x=>`<option ${State.kolPicker.platform===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="poolGroup">${['全部分组','关注','跟进','已合作'].map(x=>`<option ${State.kolPicker.group===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="kol-list">${data.map(k=>{const disabled=current.has(k.handle),sel=State.kolPicker.selected.has(k.id);return `<div class="pool-row ${sel?'selected':''} ${disabled?'disabled':''}" data-pool="${k.id}" data-disabled="${disabled}"><input type="checkbox" ${sel?'checked':''} ${disabled?'disabled':''}><div class="avatar">${e(k.initials)}</div><div><b>${e(k.handle)}</b><br><span class="muted">${e(k.followers)} · ${e(k.platform)} · ${e(k.region)}</span></div><span class="pill ${k.level==='头部'?'dark':''}">${e(k.level)}</span><span class="pill">${disabled?'已在项目':e(k.group)}</span></div>`;}).join('')||'<div class="empty">没有匹配的 KOL</div>'}</div><div class="selected-bar"><span>已选 ${State.kolPicker.selected.size} 个 KOL</span><span>新加入后默认从「1. 发现」开始</span></div><div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="add-selected-kols" ${State.kolPicker.selected.size?'':'disabled'}>添加 ${State.kolPicker.selected.size} 个 KOL</button></div>`;}
function uploadModal(){const k=currentCampaign().kols.find(x=>x.id===State.upload?.kolId);return `<div class="modal-head"><div><h3>添加截图</h3><div class="modal-sub">${e(k?.handle||'KOL')} · 阶段 ${State.upload?.step-1} → ${State.upload?.step} ${STAGES[(State.upload?.step||2)-1]}</div></div><button class="btn" data-action="close-modal">关闭</button></div><form id="uploadForm"><div class="drop-zone" id="dropZone"><div style="font-size:28px">📷</div><div>拖拽截图到此，或 <b style="color:#075bd9">点击上传</b></div><div class="muted">支持 PNG / JPG · 纯前端只记录数量</div><div class="file-name" id="uploadFileName">${e(State.uploadFileName)}</div><input type="file" id="fileInput" accept="image/*" hidden></div><div class="field"><label>备注</label><textarea rows="3" name="note" placeholder="例：用户签收时拍的开箱照"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存</button></div></form>`;}
function confirmModal(){return `<div class="modal-head"><div><h3>确认删除推广？</h3><div class="modal-sub">删除后该推广会从当前前端 state 中移除。</div></div></div><div class="modal-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-delete">确认删除</button></div>`;}
function getKolById(id){const c=currentCampaign();return c?.kols.find(x=>x.id===id);}
function simulateTrackingCheck(id){const k=getKolById(id);if(!k)return false;k.tracking=Object.assign({courier:'SF Express',no:'',status:'待发货',last:'—',delivered:false},k.tracking||{});const no=String(k.tracking.no||'').trim();if(!no||no==='—'){alert('请先输入快递单号');return false;}const delivered=no.replace(/\s/g,'').length>=8||k.stage>=6;if(delivered){k.tracking.status='✓ 已送达 · 请提醒 KOL 确认发布排期';k.tracking.delivered=true;k.tracking.last='刚刚';k.reminder='物流显示已送达，请跟进发布排期';if(k.stage<6){k.stage=6;k.daysInStage=0;k.posts='0 / 1';ensureKol(k);}alert(`${k.handle} 物流显示已送达，已加入今日提醒。`);}else{k.tracking.status='运输中 · 暂未送达';k.tracking.delivered=false;k.tracking.last='刚刚';k.reminder='';alert(`${k.handle} 物流暂未送达。`);}return true;}
function renderTasks(){const c=currentCampaign();const delivered=(c?.kols||[]).filter(k=>k.tracking?.delivered&&k.stage===6);const items=[...(delivered.length?[["高",`${delivered.length} 个样品已送达，提醒发布`,`stage=6&delivered=1`]]:[]),['高','处理 3→4 回复到合作转化低','stage=3'],['中','检查到货超 7 天未发布样品','stage=6'],['低','整理已统计内容的合同归档','tab=contracts']].slice(0,3);taskDock.innerHTML=`<div class="task-panel"><h3>今日该做什么</h3>${items.map(t=>`<div class="task" data-task="${t[2]}"><span class="pill ${t[0]==='高'?'red':t[0]==='中'?'yellow':'blue'}">${t[0]}</span><div><b>${t[1]}</b><br><span>点击跳转到相关筛选</span></div></div>`).join('')}</div>`;}
document.addEventListener('click',ev=>{
  const nav=ev.target.closest('[data-nav]');if(nav){State.section=nav.dataset.nav;State.view='list';render();return;}
  const act=ev.target.closest('[data-action]')?.dataset.action;
  if(act==='export-pdf'||act==='export-csv'||act==='todo'){alert('该功能开发中');return;}
  if(act==='new-campaign'){State.section='projects';openCampaignForm('create');return;}
  if(act==='open-detail'){State.currentCampaignId=ev.target.closest('[data-id]')?.dataset.id||'c1';State.section='projects';State.view='detail';State.currentTab='kol';render();return;}
  if(act==='back-list'){State.view='list';render();return;}
  if(act==='edit-campaign'){openCampaignForm('edit');return;}
  if(act==='cancel-campaign'){const c=currentCampaign();c.status='已取消';render();return;}
  if(act==='delete-campaign'){State.modal='confirm';render();return;}
  if(act==='confirm-delete'){State.campaigns=State.campaigns.filter(c=>c.id!==State.currentCampaignId);State.currentCampaignId=State.campaigns[0]?.id||null;State.view='list';State.modal=null;render();return;}
  if(act==='close-modal'){State.modal=null;State.upload=null;State.uploadFileName='';render();return;}
  if(act==='open-kol-picker'){State.modal='kol';State.kolPicker={search:'',platform:'全部平台',group:'全部分组',selected:new Set()};render();return;}
  if(act==='add-selected-kols'){const c=currentCampaign();State.kolPicker.selected.forEach(id=>{const p=pool.find(x=>x.id===id);if(p&&!c.kols.some(k=>k.handle===p.handle))c.kols.push(makeKol(p.handle,p.platform,p.followers,1,p.group,p.level,{join:'今天'}));});State.modal=null;State.kolPicker.selected.clear();render();return;}
  if(act==='advance-kol'){ev.stopPropagation();const id=ev.target.closest('[data-kol]').dataset.kol;const k=currentCampaign().kols.find(x=>x.id===id);if(k&&k.stage<9){k.stage++;k.daysInStage=0;k.posts=k.stage>=7?'1 / 1':'0 / 1';ensureKol(k);render();}return;}
  if(act==='open-upload'){ev.stopPropagation();State.upload={kolId:ev.target.closest('[data-kol]').dataset.kol,step:+ev.target.closest('[data-step]').dataset.step};State.uploadFileName='';State.modal='upload';render();return;}
  if(act==='save-kol-settings'){ev.stopPropagation();alert('已保存 Shopify 链接 / 物流信息');render();return;}
  if(act==='check-track'||act==='refresh-track'){ev.stopPropagation();const id=ev.target.closest('[data-kol]').dataset.kol;State.trackingLoading=id;render();setTimeout(()=>{simulateTrackingCheck(id);State.trackingLoading=null;render();},act==='refresh-track'?2000:900);return;}
  const seg=ev.target.closest('[data-status]');if(seg){State.filterStatus=seg.dataset.status;render();return;}
  const tab=ev.target.closest('[data-tab]');if(tab){State.currentTab=tab.dataset.tab;render();return;}
  const card=ev.target.closest('[data-campaign-card]');if(card&&!ev.target.closest('button,input,select,textarea')){State.currentCampaignId=card.dataset.campaignCard;State.view='detail';State.currentTab='kol';render();return;}
  const row=ev.target.closest('[data-kol-row]');if(row&&!ev.target.closest('button,input,select,textarea')){const id=row.dataset.kolRow;State.expandedRows.has(id)?State.expandedRows.delete(id):State.expandedRows.add(id);render();return;}
  const poolRow=ev.target.closest('[data-pool]');if(poolRow&&poolRow.dataset.disabled!=='true'){const id=poolRow.dataset.pool;State.kolPicker.selected.has(id)?State.kolPicker.selected.delete(id):State.kolPicker.selected.add(id);render();return;}
  const task=ev.target.closest('[data-task]');if(task){State.section='projects';State.view='list';State.filterStatus='进行中';State.listSearch='';history.replaceState(null,'',location.pathname+'?'+task.dataset.task);console.log('跳转任务筛选：',task.dataset.task);alert('已跳转到相关筛选：'+task.dataset.task);render();}
});
function refocus(id){setTimeout(()=>{const el=document.getElementById(id);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(_){}}},0)}
document.addEventListener('input',ev=>{const bind=ev.target.closest('[data-kol-input]');if(bind){const k=getKolById(bind.dataset.kolInput);if(k){if(bind.dataset.field==='shopifyUrl')k.shopifyUrl=bind.value.trim();if(bind.dataset.trackField){k.tracking=Object.assign({courier:'SF Express',no:'',status:'待发货',last:'—',delivered:false},k.tracking||{});k.tracking[bind.dataset.trackField]=bind.value.trim();}}return;}if(ev.target.id==='listSearch'){State.listSearch=ev.target.value;render();refocus('listSearch');}if(ev.target.id==='detailSearch'){State.detailSearch=ev.target.value;render();refocus('detailSearch');}if(ev.target.id==='topSearch'){if(State.section==='projects'&&State.view==='detail')State.detailSearch=ev.target.value;else if(State.section==='projects')State.listSearch=ev.target.value;render();refocus('topSearch');}if(ev.target.id==='poolSearch'){State.kolPicker.search=ev.target.value;render();refocus('poolSearch');}});
document.addEventListener('change',ev=>{if(ev.target.id==='poolPlatform'){State.kolPicker.platform=ev.target.value;render();}if(ev.target.id==='poolGroup'){State.kolPicker.group=ev.target.value;render();}if(ev.target.id==='fileInput'){State.uploadFileName=ev.target.files[0]?.name||'';const el=document.getElementById('uploadFileName');if(el)el.textContent=State.uploadFileName;}});
document.addEventListener('submit',ev=>{if(ev.target.id==='campaignForm'){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());if(State.formMode==='edit'){Object.assign(currentCampaign(),{name:f.name,product:f.product,price:f.price,status:f.status,target:+f.target||0,budget:+f.budget||0,spent:+f.spent||0,start:f.start,end:f.end,owner:f.owner,type:f.type});}else{const c=makeCampaign('c'+(++uid),f.name,f.status,f.product,+f.target||0,+f.budget||0,+f.spent||0,[],{price:f.price,start:f.start,end:f.end,owner:f.owner,type:f.type,sales:'$0',impressions:'—',roi:'—'});State.campaigns.unshift(c);State.currentCampaignId=c.id;State.filterStatus='全部';State.view='list';}State.modal=null;render();}if(ev.target.id==='uploadForm'){ev.preventDefault();const c=currentCampaign(),k=c.kols.find(x=>x.id===State.upload?.kolId),step=State.upload?.step;if(k&&step){k.timeline[step]=k.timeline[step]||{};k.timeline[step].screenshots=(+k.timeline[step].screenshots||0)+1;}State.modal=null;State.upload=null;State.uploadFileName='';render();}});
document.addEventListener('click',ev=>{if(ev.target.closest('#dropZone')&&ev.target.id!=='fileInput')document.getElementById('fileInput')?.click();});
document.addEventListener('dragover',ev=>{if(ev.target.closest('#dropZone'))ev.preventDefault();});
document.addEventListener('drop',ev=>{if(ev.target.closest('#dropZone')){ev.preventDefault();State.uploadFileName=ev.dataTransfer.files[0]?.name||'拖拽截图.png';const el=document.getElementById('uploadFileName');if(el)el.textContent=State.uploadFileName;}});
render();
</script>
</body>
</html>
