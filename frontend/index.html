<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viltrox Marketing</title>
    <meta
      name="description"
      content="Viltrox Marketing 内部红人、项目、短链、归因和报表管理系统。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = { isDisabled: true };
      }
    </script>
    <script>
      /* 首帧注入 data-theme/data-style,避免主题闪烁。style 默认 glass。 */
      (function () {
        var r = document.documentElement;
        try {
          var p = JSON.parse(localStorage.getItem("vkpi-ui-pref-v1") || "null");
          var theme = (p && p.theme) || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var style = (p && p.style) || "glass";
          r.setAttribute("data-theme", theme);
          r.setAttribute("data-style", style);
        } catch (e) {
          r.setAttribute("data-theme", "light");
          r.setAttribute("data-style", "glass");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
