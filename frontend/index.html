<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viltrox Test</title>
    <meta name="description" content="Viltrox test environment. Sign-in required." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* 首帧注入主题、风格与玻璃清晰度,避免主题闪烁。 */
      (function () {
        var r = document.documentElement;
        function setGlassOpacity(value) {
          var n = Math.min(96, Math.max(60, Math.round(Number(value) || 78)));
          var opacity = n / 100;
          r.setAttribute("data-glass-opacity", String(n));
          r.style.setProperty("--vkpi-glass-opacity", String(opacity));
          r.style.setProperty("--vkpi-glass-card-opacity", String(Math.min(0.98, opacity + 0.08)));
          r.style.setProperty("--vkpi-glass-overlay-opacity", String(Math.max(0.9, opacity)));
          r.style.setProperty("--vkpi-glass-drawer-opacity", String(Math.max(0.88, opacity)));
        }
        try {
          var p = JSON.parse(localStorage.getItem("vkpi-ui-pref-v1") || "null");
          var theme = (p && p.theme) || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var style = (p && p.style) || "glass";
          r.setAttribute("data-theme", theme);
          r.setAttribute("data-style", style);
          setGlassOpacity(p && p.glassOpacity);
        } catch (e) {
          r.setAttribute("data-theme", "light");
          r.setAttribute("data-style", "glass");
          setGlassOpacity(78);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" data-nosnippet></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
