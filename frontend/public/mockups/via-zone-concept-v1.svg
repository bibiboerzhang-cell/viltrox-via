      <ellipse cx="408" cy="701" rx="5" ry="6" fill="#121826"/>
      <ellipse cx="452" cy="701" rx="5" ry="6" fill="#121826"/>
      <path d="M424 719C430 715 436 715 442 719" stroke="#E58B7F" stroke-width="4" stroke-linecap="round"/>
