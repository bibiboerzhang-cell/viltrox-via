<svg width="620" height="1080" viewBox="0 0 620 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="70" y1="20" x2="520" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F8F3EC"/>
    </linearGradient>
    <linearGradient id="card" x1="86" y1="42" x2="506" y2="966" gradientUnits="userSpaceOnUse">
