    <path d="M208 379C212 376 216 376 220 379" stroke="#EA9184" stroke-width="3" stroke-linecap="round"/>
    <path d="M205 386C209 391 219 391 223 386" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M192 354L200 338L209 357" fill="#2E3138"/>
    <path d="M236 354L228 338L219 357" fill="#2E3138"/>
    <ellipse cx="214" cy="425" rx="95" ry="10" fill="#D0D7E2"/>
    <ellipse cx="214" cy="425" rx="52" ry="10" fill="#E7A968"/>

