    <ellipse cx="214" cy="388" rx="38" ry="25" fill="#2E3138"/>
    <ellipse cx="214" cy="370" rx="31" ry="25" fill="#2E3138"/>
    <ellipse cx="214" cy="378" rx="25" ry="18" fill="#FCFCFD"/>
    <circle cx="203" cy="367" r="4.5" fill="#111827"/>
