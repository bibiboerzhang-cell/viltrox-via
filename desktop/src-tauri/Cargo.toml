[package]
name = "vkpi-desktop-runner"
version = "0.1.0"
description = "V-KPI 本地算力 Worker 桌面外壳(Tauri sidecar 启动 CLI runner)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 单一二进制,桌面端;移动端目标未启用(MVP 只做桌面)。
[[bin]]
name = "vkpi-desktop-runner"
path = "src/main.rs"
