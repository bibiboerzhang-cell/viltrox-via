<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V-KPI 本地算力 Runner</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262b36;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #3b82f6;
        --accent-2: #22c55e;
        --danger: #ef4444;
        --field: #0c0e13;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 32px; }
      h1 { font-size: 18px; margin: 4px 0 2px; }
      .sub { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field.full { grid-column: 1 / -1; }
      label { font-size: 12px; color: var(--muted); }
      input[type="text"], input[type="password"], input[type="url"] {
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 13px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
      button {
        border: none;
        border-radius: 7px;
        padding: 9px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #startBtn { background: var(--accent); }
      #stopBtn { background: var(--danger); }
      .badge {
        margin-left: auto;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.running { color: #052e16; background: var(--accent-2); border-color: transparent; }
      .badge.stopped { color: var(--muted); }
      .badge.error { color: #fff; background: var(--danger); border-color: transparent; }
      .log {
        background: #05070b;
        border: 1px solid var(--border);
        border-radius: 8px;
        height: 240px;
        overflow-y: auto;
        padding: 10px 12px;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log .err { color: #fca5a5; }
      .log .empty { color: var(--muted); }
      .note { color: var(--muted); font-size: 11px; margin-top: 10px; line-height: 1.6; }
      .note b { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>V-KPI 本地算力 Runner</h1>
      <p class="sub">
        填服务器地址与你的账号,点「开始」即可把服务器下放的安全任务领回本机跑。
        本机只领四类安全任务、只拿短期任务 token,不碰任何业务决策。
      </p>

      <div class="card">
        <div class="grid">
          <div class="field full">
            <label for="base">服务器地址 (base URL)</label>
            <input id="base" type="url" placeholder="https://kpi.example.com" />
          </div>
          <div class="field">
            <label for="email">登录邮箱</label>
            <input id="email" type="text" placeholder="you@viltrox.com" autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">登录密码</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="device">设备名</label>
            <input id="device" type="text" placeholder="mac-01" />
          </div>
          <div class="field">
            <label for="taskTypes">任务类型 (可留空=全部)</label>
            <input id="taskTypes" type="text" placeholder="comment_clean,metadata_extract" />
          </div>
          <div class="field">
            <label for="python">python 解释器 (缺省 python3)</label>
            <input id="python" type="text" placeholder="python3" />
          </div>
          <div class="field">
            <label for="script">runner 脚本绝对路径</label>
            <input id="script" type="text" placeholder="/绝对路径/scripts/vkpi_local_runner.py" />
          </div>
          <div class="field full">
            <div class="row">
              <input id="once" type="checkbox" />
              <label for="once" style="cursor: pointer">只领一条跑完即停止(冒烟测试)</label>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="startBtn">开始</button>
          <button id="stopBtn" disabled>停止</button>
          <span id="status" class="badge stopped">未运行</span>
        </div>

        <p class="note">
          <b>安全说明:</b>密码只用于本机登录换取短期任务 token,不会写入命令行或日志;
          本机只执行 video_precheck / metadata_extract / download_frames / comment_clean 四类安全任务。
        </p>
      </div>

      <div class="card">
        <label style="font-size: 12px; color: var(--muted)">运行日志</label>
        <div id="log" class="log"><span class="empty">尚未开始。填好上方信息后点「开始」。</span></div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
