pid nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include       ../../runtime/vendor/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    upstream viltrox_public_web {
        server 127.0.0.1:8101;
        keepalive 32;
    }

    upstream viltrox_admin_web {
        server 127.0.0.1:8102;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        ssl_certificate ../../runtime/nginx/certs/viltrox-local.crt;
        ssl_certificate_key ../../runtime/nginx/certs/viltrox-local.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 550m;

        location /api/upload/video {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location /api/audit/stream/ {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            add_header X-Accel-Buffering no;
        }

        location = /api/via/sessions {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            add_header X-Accel-Buffering no;
        }

        location /api/via/sessions/ {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            add_header X-Accel-Buffering no;
        }

        location /assets/ {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location / {
            proxy_pass http://viltrox_public_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 180;
            proxy_send_timeout 180;
        }
    }

    server {
        listen 9443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        ssl_certificate ../../runtime/nginx/certs/viltrox-local.crt;
        ssl_certificate_key ../../runtime/nginx/certs/viltrox-local.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 100m;

        location / {
            proxy_pass http://viltrox_admin_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 180;
            proxy_send_timeout 180;
        }
    }
}
