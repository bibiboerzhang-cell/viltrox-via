[pytest]
testpaths = tests backend/tests
pythonpath = backend
addopts = --strict-markers
markers =
    pg: exercises a live Postgres database (auto-skipped when PG is unavailable)

# Coverage baseline (optional; requires pytest-cov, already in .venv).
# --cov is intentionally NOT wired into addopts so the suite stays runnable
# without the plugin. Config lives in .coveragerc. Run it with:
#   PYTHONPATH=backend:. .venv/bin/python -m pytest tests/ -q \
#       --cov=backend/app --cov-report=term-missing
