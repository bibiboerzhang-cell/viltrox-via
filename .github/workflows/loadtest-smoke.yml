name: loadtest-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run loadtest smoke
        env:
          ADMIN_PASSWORD: "AdminPass123!"
          LOAD_TEST_INCLUDE_ADMIN: "0"
          LOAD_TEST_PHASES: "20,40,80"
          LOAD_TEST_REQUESTS_PER_PHASE: "120"
          LOAD_TEST_TIMEOUT_SEC: "20"
        run: bash ./scripts/run_loadtest_smoke_ci.sh
      - name: Upload loadtest report
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-smoke-report
          path: runtime/logs/load-test-*.json
          if-no-files-found: warn
