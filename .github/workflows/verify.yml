name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: viltrox_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viltrox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      # setup-python's hosted-toolcache interpreter can be group writable on
      # GitHub runners.  The canonical gate intentionally rejects that trust
      # boundary, so run it from a private copied venv outside the checkout.
      PYTHON_BIN: ${{ runner.temp }}/vkpi-ci-python/bin/python
      DB_RUNTIME_BACKEND: postgres
      DB_USE_PGBOUNCER: "0"
      DATABASE_URL: postgresql://postgres@localhost:5432/viltrox_ci
    steps:
      - uses: actions/checkout@v6
        with:
          # Gitleaks compares the pushed commit with its parent. A depth-1
          # checkout makes HEAD look like a root commit and scans the whole
          # repository snapshot on every push.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          umask 077
          python -m venv --copies "$RUNNER_TEMP/vkpi-ci-python"
          ci_python_real="$(realpath "$PYTHON_BIN")"
          chmod go-w "$ci_python_real"
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -r requirements-ci.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Initialize database
        run: |
          "$PYTHON_BIN" - <<'PY'
          import asyncio

          from app.db.connection import close_db_runtime
          from app.db.startup import init_db_runtime

          async def main() -> None:
              await init_db_runtime()
              await close_db_runtime()

          asyncio.run(main())
          PY
      - name: Canonical repository/release gate
        run: bash ./scripts/verify_repo.sh

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: viltrox_pg_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viltrox_pg_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      VKPI_SKIP_DOTENV: "1"
      VKPI_PYTEST_ALLOW_LIVE_SERVICES: "1"
      DB_RUNTIME_BACKEND: postgres
      DB_TARGET_BACKEND: postgres
      DB_USE_PGBOUNCER: "0"
      DATABASE_URL: postgresql://postgres@localhost:5432/viltrox_pg_integration
      LOCAL_DATABASE_URL: postgresql://postgres@localhost:5432/viltrox_pg_integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Initialize disposable PostgreSQL schema
        run: |
          python - <<'PY'
          import asyncio

          from app.db.connection import close_db_runtime
          from app.db.startup import init_db_runtime

          async def main() -> None:
              await init_db_runtime()
              await close_db_runtime()

          asyncio.run(main())
          PY
      - name: Real PostgreSQL integration and authorization gate
        run: python -m pytest -q -m pg --tb=short
