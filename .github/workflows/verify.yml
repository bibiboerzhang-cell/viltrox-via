name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      VKPI_SKIP_DOTENV: "1"
      # setup-python's hosted-toolcache interpreter can be group writable on
      # GitHub runners.  The canonical gate intentionally rejects that trust
      # boundary.  The install step hardens the ephemeral interpreter tree;
      # this profile permits a fresh mirrored dependency proof only for the
      # non-runtime GitHub static gate (deploy keeps the reviewed baseline).
      VKPI_SAFE_PYTHON_PROFILE: github-actions-static-v1
    steps:
      - uses: actions/checkout@v6
        with:
          # Gitleaks compares the pushed commit with its parent. A depth-1
          # checkout makes HEAD look like a root commit and scans the whole
          # repository snapshot on every push.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          umask 077
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          ci_python="$(command -v python)"
          ci_python_real="$(realpath "$ci_python")"
          ci_purelib="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          ci_platlib="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          chmod go-w "$ci_python_real"
          chmod -R go-w "$ci_purelib"
          if [ "$ci_platlib" != "$ci_purelib" ]; then
            chmod -R go-w "$ci_platlib"
          fi
          # Python 3.12 resolves sys.prefix to the base interpreter under -S,
          # so the safe router must keep the setup-python interpreter whose
          # dependency roots it mirrors.  A system-site-packages venv exists
          # separately for contract tests that intentionally execute the
          # repository-standard .venv/bin/python path.
          python -m venv --system-site-packages .venv
          test -x "$GITHUB_WORKSPACE/.venv/bin/python"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import pytest'
          printf 'PYTHON_BIN=%s\n' "$ci_python" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Assert hermetic database boundary
        run: |
          "$PYTHON_BIN" - <<'PY'
          import os

          forbidden = (
              "DATABASE_URL",
              "LOCAL_DATABASE_URL",
              "DATABASE_POOL_URL",
              "DB_RUNTIME_BACKEND",
              "DB_TARGET_BACKEND",
              "DB_USE_PGBOUNCER",
              "VKPI_PYTEST_ALLOW_LIVE_SERVICES",
          )
          leaked = [name for name in forbidden if os.environ.get(name)]
          if leaked:
              raise SystemExit(
                  "verify job inherited live database configuration: "
                  + ",".join(leaked)
              )
          PY
      - name: Canonical repository/release gate
        run: |
          set -o pipefail
          bash ./scripts/verify_repo.sh 2>&1 | tee "$RUNNER_TEMP/verify-gate.log"
      - name: Annotate gate failure (anonymous-readable)
        if: failure()
        run: |
          # 公开仓的日志需登录才能看,注解不需要:把失败要点打成 ::error:: 注解(每步最多 10 条)。
          log="$RUNNER_TEMP/verify-gate.log"
          [ -f "$log" ] || { echo "::error::verify gate log missing"; exit 0; }
          grep -E '^\[verify\] FAIL|^(FAILED|ERROR) |^E   |Error:|SystemExit|Traceback' "$log" \
            | grep -vE 'PydanticDeprecated' | tail -n 10 \
            | while IFS= read -r line; do printf '::error title=verify gate::%s\n' "${line:0:900}"; done
          printf '::error title=verify gate summary::%s\n' "$(grep -E '[0-9]+ (passed|failed|error)' "$log" | tail -n 1)"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: viltrox_pg_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viltrox_pg_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      VKPI_SKIP_DOTENV: "1"
      VKPI_PYTEST_ALLOW_LIVE_SERVICES: "1"
      DB_RUNTIME_BACKEND: postgres
      DB_TARGET_BACKEND: postgres
      DB_USE_PGBOUNCER: "0"
      DATABASE_URL: postgresql://postgres@localhost:5432/viltrox_pg_integration
      LOCAL_DATABASE_URL: postgresql://postgres@localhost:5432/viltrox_pg_integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Initialize disposable PostgreSQL schema
        run: |
          python - <<'PY'
          import asyncio

          from app.db.connection import close_db_runtime
          from app.db.startup import init_db_runtime

          async def main() -> None:
              await init_db_runtime()
              await close_db_runtime()

          asyncio.run(main())
          PY
      - name: Real PostgreSQL integration and authorization gate
        run: |
          set -o pipefail
          python -m pytest -q -m pg --tb=short 2>&1 | tee "$RUNNER_TEMP/pg-gate.log"
      - name: Annotate PostgreSQL gate failure (anonymous-readable)
        if: failure()
        run: |
          log="$RUNNER_TEMP/pg-gate.log"
          [ -f "$log" ] || { echo "::error::pg gate log missing"; exit 0; }
          grep -E '^(FAILED|ERROR) |^E   |Error:|Traceback' "$log" | grep -vE 'PydanticDeprecated' | tail -n 10 \
            | while IFS= read -r line; do printf '::error title=pg gate::%s\n' "${line:0:900}"; done
          printf '::error title=pg gate summary::%s\n' "$(grep -E '[0-9]+ (passed|failed|error)' "$log" | tail -n 1)"
